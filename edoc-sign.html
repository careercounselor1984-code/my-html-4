<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>좋은일자리 · 모바일 서명</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172a47;font:15px/1.55 system-ui,"Malgun Gothic",sans-serif}.container{max-width:680px;margin:28px auto;padding:10px}.card{background:white;border:1px solid #dde5f1;border-radius:12px;padding:22px;margin-bottom:12px}h1{font-size:21px;margin:0 0 8px}h2{font-size:16px}.muted{color:#617087;font-size:13px}.error{color:#9e2934}input[type=password]{width:100%;padding:13px;border:1px solid #b5c0d2;border-radius:8px;font-size:18px}button{background:#225bb0;border:0;color:#fff;border-radius:7px;padding:11px 16px;cursor:pointer}button:disabled{opacity:.5}canvas{width:100%;height:185px;border:2px dashed #a5b6ca;background:#fff;touch-action:none;border-radius:6px}iframe{width:100%;height:410px;border:1px solid #cbd5e2;border-radius:7px}@media(max-width:600px){.container{margin:0}.card{padding:16px}iframe{height:350px}}</style></head><body><div class="container"><div class="card"><h1>좋은일자리 · 참여자 전자서명</h1><p class="muted">문서를 직접 확인한 뒤 서명하세요. 링크와 확인코드를 다른 사람에게 전달하지 마세요.</p><p id="notice" role="status"></p></div><div id="first" class="card"><h2>확인코드 입력</h2><p class="muted">상담사에게 별도로 전달받은 6자리 숫자</p><input type="password" inputmode="numeric" id="pin" maxlength="6" placeholder="확인코드 6자리"><p><button id="view">문서 확인하기</button></p></div><div id="next" class="card" hidden><h2 id="title"></h2><p>참여자: <strong id="person"></strong></p><iframe id="pdf" title="서명할 문서 PDF"></iframe><p class="muted">서명 전 전체 문서와 사유, 날짜를 확인해 주세요.</p><h2>손가락 또는 마우스로 서명</h2><canvas id="pad"></canvas><p><button id="clear" style="background:#69778b">다시 쓰기</button></p><p><label><input type="checkbox" id="ack"> 위 문서를 확인했으며, 본인의 의사로 서명합니다.</label></p><button id="done">서명 완료</button><p class="muted">서명 후 PDF가 확정됩니다. 별도의 휴대전화 본인인증 서비스는 아직 연결 전입니다.</p></div></div><script>
(()=>{'use strict';const api='https://bowxlaiyjxknqccoughl.supabase.co/functions/v1/edoc-sign-v2',token=new URLSearchParams(location.hash.slice(1)).get('t')||'';history.replaceState(null,'',location.pathname);const $=id=>document.getElementById(id);let pin='',url='',marked=false;function notify(x,err=false){$('notice').textContent=x;$('notice').className=err?'error':''}const post=async data=>{let r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'요청 오류');return d};const canvas=$('pad'),ctx=canvas.getContext('2d');let painting=false;function clear(){const ratio=Math.min(devicePixelRatio||1,2),b=canvas.getBoundingClientRect();canvas.width=b.width*ratio;canvas.height=b.height*ratio;ctx.scale(ratio,ratio);ctx.fillStyle='white';ctx.fillRect(0,0,b.width,b.height);ctx.strokeStyle='#123767';ctx.lineWidth=2.7;ctx.lineCap='round';ctx.lineJoin='round';marked=false}function point(e){let b=canvas.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]}canvas.onpointerdown=e=>{painting=true;canvas.setPointerCapture(e.pointerId);const[x,y]=point(e);ctx.beginPath();ctx.moveTo(x,y)};canvas.onpointermove=e=>{if(!painting)return;const[x,y]=point(e);ctx.lineTo(x,y);ctx.stroke();marked=true};canvas.onpointerup=()=>{painting=false};canvas.onpointercancel=()=>{painting=false};$('clear').onclick=clear;
$('view').onclick=async()=>{pin=$('pin').value.trim();if(!token)return notify('서명 링크가 유효하지 않습니다.',true);$('view').disabled=true;try{let d=await post({action:'sign_read',token,pin}),raw=atob(d.pdf_base64),buf=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)buf[i]=raw.charCodeAt(i);url=URL.createObjectURL(new Blob([buf],{type:'application/pdf'}));$('pdf').src=url;$('person').textContent=d.signer_name;$('title').textContent=d.document_title;$('first').hidden=true;$('next').hidden=false;clear();notify('서류를 확인한 뒤 서명하세요.')}catch(e){notify(e.message,true)}finally{$('view').disabled=false}};
$('done').onclick=async()=>{if(!marked)return notify('서명을 작성해 주세요.',true);if(!$('ack').checked)return notify('문서 확인 동의가 필요합니다.',true);$('done').disabled=true;try{let d=await post({action:'sign_complete',token,pin,accepted:true,signature_png:canvas.toDataURL('image/png')});$('next').hidden=true;notify('서명 완료: 상담사에게 완료 상태가 표시됩니다. 접수 관리번호 '+d.case_id.slice(0,8))}catch(e){notify(e.message,true);$('done').disabled=false}};if(!token){$('first').hidden=true;notify('잘못된 서명 링크입니다.',true)}})();
</script></body></html>
