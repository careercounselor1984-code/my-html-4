<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IAP 전산 반영 준비</title>
<style>*{box-sizing:border-box}body{margin:0;width:auto;min-width:320px;max-width:100%;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;background:#f5f7fb;color:#172033}.wrap{padding:15px}.head{display:flex;align-items:flex-start;gap:10px}.back{font-size:11px;text-decoration:none;color:#2563eb;font-weight:900}.ver{margin-left:auto;font-size:9px;color:#2563eb;background:#edf4ff;border:1px solid #cfe0fb;border-radius:999px;padding:4px 7px;font-weight:950}h1{font-size:17px;margin:7px 0 3px}.desc{font-size:10.5px;color:#77859a;line-height:1.55}.status{margin-top:11px;border:1px solid #dce6f3;background:#fff;border-radius:11px;padding:10px;font-size:10.8px;line-height:1.55}.status.ok{border-color:#b9e5cf;background:#f0fbf5;color:#17613b}.status.err{border-color:#f1b8b8;background:#fff4f4;color:#a12626}.grid{display:grid;grid-template-columns:105px 1fr;gap:5px 8px}.grid b{color:#697990}.card{margin-top:9px;border:1px solid #dfe7f1;background:#fff;border-radius:11px;overflow:hidden}.ct{padding:9px 11px;background:#f5f8fd;font-size:11px;font-weight:950}.row{padding:8px 11px;border-top:1px solid #edf1f6;font-size:10.5px;line-height:1.5}.row:first-of-type{border-top:0}.actions{display:flex;gap:7px;margin-top:10px}button{flex:1;height:36px;border:1px solid #ccd8e7;border-radius:9px;background:#fff;color:#526178;font:inherit;font-size:11px;font-weight:900;cursor:pointer}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.primary:disabled{opacity:.45;cursor:not-allowed}.note{margin-top:9px;font-size:9.8px;color:#8491a5;line-height:1.55}.empty{color:#98a5b8}.pill{display:inline-block;border-radius:999px;padding:2px 6px;font-size:9px;font-weight:900;background:#eef4ff;color:#2563eb}</style></head>
<body><div class="wrap"><div class="head"><a class="back" href="popup.html">← 전체 메뉴</a><span class="ver">v1.4.24</span></div><h1>IAP 전산 반영 준비</h1><div class="desc">상담일지 통합본에서 사전점검을 통과하고 보낸 IAP 계획을 확인합니다.</div><div id="status" class="status">대기자료를 확인하고 있습니다.</div><div id="content"></div><div class="actions"><button id="refreshBtn">다시 확인</button><button id="clearBtn">대기자료 지우기</button><button id="repairDatesBtn" title="기존 행 날짜 점검·8자리 정정">날짜 점검·수정</button><button class="primary" id="applyBtn" disabled>Work24 IAP 전체 자동입력</button></div><pre id="diag" style="display:none;white-space:pre-wrap;margin-top:9px;padding:9px;border:1px solid #dfe7f1;border-radius:9px;background:#fff;font-size:9px;line-height:1.45;color:#64748b"></pre><div class="note">※ 상담일지 통합본에서 사전점검을 통과한 취업지원·구직활동 계획을 Work24 IAP 화면에 자동입력합니다. 오류 팝업이 뜬 경우 ‘날짜 점검·수정’을 먼저 실행하세요. 최종 저장·제출은 상담사가 직접 확인 후 처리합니다.</div></div><script src="iap.js"></script><script src="training-core.js"></script><script src="training-counts.js"></script></body></html>
