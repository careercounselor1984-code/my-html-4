<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>좋은일자리 · 근무지 카카오맵</title>
<style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#193451}
*{box-sizing:border-box}body{margin:0;background:#f2f6fa}.wrap{max-width:940px;padding:22px 16px 38px;margin:auto}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:23px;margin:4px 0 8px}.sub{font-size:13px;color:#60768e;line-height:1.6;margin:0}
.pill{border:1px solid #cfdce8;background:#fff;color:#55718c;border-radius:99px;font-size:12px;padding:7px 10px;white-space:nowrap}
.card{padding:17px;background:#fff;border:1px solid #dce5ed;border-radius:15px;box-shadow:0 8px 22px #2450750c;margin-bottom:13px}
label{font-size:13px;font-weight:750;display:block;margin-bottom:8px}.controls{display:flex;gap:8px}
input{min-width:0;flex:1;border:1px solid #c8d6e5;border-radius:9px;min-height:42px;font:inherit;font-size:14px;padding:10px}
button,a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font:750 13px/1.3 inherit;border:0;border-radius:9px;padding:12px 14px;cursor:pointer;white-space:nowrap}
button{background:#245e97;color:white}a.btn{background:#fee500;color:#372f11}a.btn.secondary{background:#eaf1fa;color:#245e97}
.links{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.links a[hidden]{display:none}
#map{width:100%;height:min(62vh,520px);min-height:330px;background:#edf4fa;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#6d8398;font-size:13px;text-align:center;padding:12px;overflow:hidden}
#state{font-size:13px;color:#26654f;line-height:1.7;min-height:22px;margin:8px 0}#state.error{color:#a52436}
footer{font-size:12px;color:#718399;line-height:1.6;padding:6px 2px}.heading{font-size:12px;font-weight:800;color:#32669b;letter-spacing:.05em}
@media(max-width:520px){.wrap{padding:14px 10px}h1{font-size:20px}.card{padding:12px}.controls{flex-wrap:wrap}.controls button{width:100%}#map{min-height:300px;height:53vh}}
</style>
<script src="./kakao-share-config.js"></script>
</head>
<body><main class="wrap">
<header><div><div class="heading">GOOD JOB · KAKAO MAP API</div><h1>채용공고 근무지 확인</h1><p class="sub" id="jobTitle">근무지를 지도에서 확인하고 길찾기 링크를 열 수 있습니다.</p></div><div class="pill">카카오맵 API</div></header>
<section class="card"><form id="searchForm"><label for="query">기업 주소 또는 장소명</label><div class="controls"><input id="query" required maxlength="180" placeholder="예: 울산 북구 송내4길 14" autocomplete="off"><button type="submit">📍 지도 검색</button></div></form>
<div class="links"><a id="external" class="btn" href="https://map.kakao.com" target="_blank" rel="noopener noreferrer">카카오맵에서 검색</a><a id="directions" class="btn secondary" href="#" target="_blank" rel="noopener noreferrer" hidden>길찾기</a></div>
<p id="state" role="status" aria-live="polite"></p></section>
<section class="card"><div id="map" role="region" aria-label="카카오맵 근무지 지도">지도 API를 준비하고 있습니다…</div></section>
<footer>채용공고의 근무지 주소만 사용합니다. 내담자 개인정보 및 상담 기록은 전송·저장하지 않습니다. 위치는 공고의 실제 근무지와 다를 수 있으므로 원문 확인이 필요합니다. 지도 API 미승인·쿼터 제한 시 '카카오맵에서 검색' 링크를 이용하세요.</footer>
</main>
<script>
(function(){
"use strict";
const q=new URLSearchParams(location.search);
const $=id=>document.getElementById(id);
const clean=(v,max=180)=>String(v||"").replace(/[\x00-\x1f\x7f]/g," ").trim().slice(0,max);
const initial=clean(q.get("q"));
const label=clean(q.get("label"),120);
if(label)$("jobTitle").textContent=label+" · 근무지 지도";
$("query").value=initial;
let map=null,marker=null,geocoder=null,places=null,ready=false,lastRequest=0;
function showStatus(t,error=false){$("state").textContent=t;$("state").classList.toggle("error",error)}
function externalLink(v){return "https://map.kakao.com/link/search/"+encodeURIComponent(v)}
function setExternal(term){$("external").href=externalLink(term);$("directions").hidden=true}
function showError(t){$("map").textContent=t;showStatus(t,true)}
function mark(lat,lng,name){
 const latLng=new kakao.maps.LatLng(lat,lng);
 map.setCenter(latLng);map.setLevel(4);
 if(marker)marker.setMap(null);
 marker=new kakao.maps.Marker({position:latLng,map:map});
 $("directions").href="https://map.kakao.com/link/to/"+encodeURIComponent(name)+","+lat+","+lng;
 $("directions").hidden=false;
 showStatus("지도에서 위치를 확인했습니다. 공고에 기재된 실제 근무지와 일치하는지 확인해 주세요.");
}
function search(term){
 term=clean(term);if(!term){showStatus("주소 또는 장소명을 입력해 주세요.",true);return}
 setExternal(term);
 if(!ready){showStatus("지도 SDK가 준비되지 않았습니다. 카카오맵 검색 버튼은 이용할 수 있습니다.",true);return}
 const call=++lastRequest;
 showStatus("카카오맵에서 주소를 찾는 중입니다…");
 geocoder.addressSearch(term,(matches,status)=>{
   if(call!==lastRequest)return;
   if(status===kakao.maps.services.Status.OK&&matches&&matches[0]){
     mark(Number(matches[0].y),Number(matches[0].x),term);return;
   }
   places.keywordSearch(term,(results,keywordStatus)=>{
     if(call!==lastRequest)return;
     if(keywordStatus===kakao.maps.services.Status.OK&&results&&results[0]){
       mark(Number(results[0].y),Number(results[0].x),results[0].place_name||term);return;
     }
     showStatus("해당 위치를 찾지 못했습니다. 주소를 더 정확히 입력하거나 카카오맵 검색을 이용해 주세요.",true);
   });
 });
}
function boot(){
 const key=String(window.GOODJOB_KAKAO_JS_KEY||"").trim();
 if(!key){showError("JavaScript 키가 설정되지 않았습니다. 카카오 디벨로퍼스 설정을 확인해 주세요.");return}
 const s=document.createElement("script");
 s.src="https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&libraries=services&appkey="+encodeURIComponent(key);
 s.onerror=()=>showError("카카오맵 SDK 로딩 실패 · 카카오맵 API 활성화 및 JavaScript SDK 도메인 설정을 확인해 주세요.");
 s.onload=()=>{
   if(!window.kakao?.maps){showError("지도 SDK를 초기화하지 못했습니다.");return}
   kakao.maps.load(()=>{
     try{
       const el=$("map");el.textContent="";
       map=new kakao.maps.Map(el,{center:new kakao.maps.LatLng(35.5808,129.3567),level:6});
       geocoder=new kakao.maps.services.Geocoder();
       places=new kakao.maps.services.Places();
       ready=true;
       if(initial)search(initial);else showStatus("상단 검색창에 근무지 주소를 입력하세요.");
     }catch(e){showError("지도 표시 실패 · "+clean(e.message,200))}
   });
 };
 document.head.appendChild(s);
}
$("searchForm").addEventListener("submit",e=>{e.preventDefault();search($("query").value)});
$("query").addEventListener("input",()=>setExternal(clean($("query").value)));
setExternal(initial||"울산 북구 송내4길 14");
boot();
})();
</script>
</body>
</html>
