name: Journal safety regression
on:
  push:
    branches:
      - "fix/journal-calc-audit-20261011"
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check safety regression
        run: |
          node --check client-guidance.js
          node tests/journal-safety.test.cjs
          node tests/kakao-compact.test.cjs
          node tests/initial-easy-mode.test.cjs
          node tests/initial-opinion-summary.test.cjs
          node tests/initial-brief-record.test.cjs
          node tests/schedule-tab.test.cjs
          node tests/tab-f5-shortcut.test.cjs
          node tests/alert-tab-clearance.test.cjs
          node tests/work24-tab-transfer.test.cjs
          node tests/training-days.test.cjs
          node tests/training-schedule-parser.test.cjs

      - name: Verify initial opinion helper with actual DOM
        run: |
          npm install --prefix /tmp/initial-dom-test jsdom@30.1.2 --no-audit --no-fund
          NODE_PATH=/tmp/initial-dom-test/node_modules node tests/work24-allowance-import.test.cjs
          NODE_PATH=/tmp/initial-dom-test/node_modules node tests/performance-guide.test.cjs
          NODE_PATH=/tmp/initial-dom-test/node_modules node tests/auth-copy-hardening.test.cjs
          NODE_PATH=/tmp/initial-dom-test/node_modules node tests/stipend-remote-dom.test.cjs
          NODE_PATH=/tmp/initial-dom-test/node_modules node tests/iap-opinion-remote-dom.test.cjs
          NODE_PATH=/tmp/initial-dom-test/node_modules node tests/iap-client-switch.test.cjs
          NODE_PATH=/tmp/initial-dom-test/node_modules node tests/iap-registration-guard.test.cjs
          NODE_PATH=/tmp/initial-dom-test/node_modules node tests/consult-reset.test.cjs
          NODE_PATH=/tmp/initial-dom-test/node_modules node tests/protected-core-dom.test.cjs
          NODE_PATH=/tmp/initial-dom-test/node_modules node tests/schedule-booking-dom.test.cjs
          NODE_PATH=/tmp/initial-dom-test/node_modules node tests/initial-opinion-assist-dom.test.cjs
          NODE_PATH=/tmp/initial-dom-test/node_modules node tests/initial-work24-assist-dom.test.cjs
          NODE_PATH=/tmp/initial-dom-test/node_modules node tests/experience-days-dom.test.cjs
          NODE_PATH=/tmp/initial-dom-test/node_modules node tests/initial-dropdowns-dom.test.cjs
          NODE_PATH=/tmp/initial-dom-test/node_modules node tests/card-reason.test.cjs
          NODE_PATH=/tmp/initial-dom-test/node_modules node tests/training-rounds-dom.test.cjs
          NODE_PATH=/tmp/initial-dom-test/node_modules node tests/journal-content-corrections.test.cjs
          NODE_PATH=/tmp/initial-dom-test/node_modules node tests/client-guidance.test.cjs

      - name: Headless Chrome initial-counseling focused-form smoke
        run: |
          node tests/initial-easy-browser-smoke.cjs
          node tests/card-reason-browser-smoke.cjs
          node tests/protected-core-browser-smoke.cjs
          node tests/full-runtime-browser-smoke.cjs
          node tests/training-browser-smoke.cjs

      - name: Headless Chrome initial-screen smoke (unauthenticated)
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || { echo "Chrome not found on GitHub runner"; exit 1; }
          timeout 45s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=2500 --dump-dom "file://$GITHUB_WORKSPACE/index.html" > /tmp/goodjob-screen.html 2>/tmp/goodjob-chrome.log
          grep -Fq '상담일지 통합본' /tmp/goodjob-screen.html
          echo "Headless Chrome DOM loaded successfully (not a substitute for authenticated testing)"
