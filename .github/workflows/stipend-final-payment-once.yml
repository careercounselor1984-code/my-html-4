name: Apply stipend final payment line
on:
  push:
    branches: ['fix/stipend-final-payment-always-20261013']
    paths: ['.github/workflows/stipend-final-payment-once.yml', 'tests/stipend-record-output.test.cjs']
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update embedded p06 and run tests
        run: |
          set -euo pipefail
          python scripts/patch_stipend_final_payment.py
          node tests/stipend-record-output.test.cjs
          node tests/journal-safety.test.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --staged --quiet; then
            git commit -m "fix: include final expected payment on all stipend records"
            git push origin HEAD:fix/stipend-final-payment-always-20261013
          fi
