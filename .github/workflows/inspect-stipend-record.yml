name: Inspect stipend journal module
on:
  push:
    branches: ['fix/stipend-dynamic-record-20261013']
    paths: ['.github/workflows/inspect-stipend-record.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export p06 source for review
        run: |
          python - <<'PY'
          import base64,re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'"id":"p06","title":"[^"]+","b64":"([A-Za-z0-9+/=]+)"',s)
          if not m: raise SystemExit('p06 record module missing')
          html=base64.b64decode(m.group(1)).decode('utf-8')
          Path('debug').mkdir(exist_ok=True)
          Path('debug/p06-decoded.html').write_text(html,encoding='utf-8')
          lines=html.splitlines()
          keywords=['지급 및 소득','기본 수당','가족 수당','신고소득 합계','최종 지급 총액','소득 판정','function build','function render','family','income','report']
          with Path('debug/p06-map.txt').open('w',encoding='utf-8') as f:
            f.write('P06 length='+str(len(html))+' lines='+str(len(lines))+'\n')
            hits=[i for i,line in enumerate(lines) if any(k.lower() in line.lower() for k in keywords)]
            seen=set()
            for i in hits:
              a,b=max(0,i-3),min(len(lines),i+5)
              for j in range(a,b):
                if j not in seen:
                  f.write(f'{j+1}: {lines[j][:260]}\n')
                  seen.add(j)
              f.write('----\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/p06-decoded.html debug/p06-map.txt
          git commit -m "chore: inspect stipend module for record cleanup" || true
          git push
