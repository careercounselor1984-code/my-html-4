name: Verify deferral counseling journal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-deferral-journal.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing deferral form without rewriting source
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const vm = require('node:vm');
          const source = fs.readFileSync('index.html', 'utf8');
          const pages = JSON.parse(source.match(/const PAGES = (.*?);\n/s)[1]);
          const page = pages.find(value => value.id === 'p11');
          assert(page, 'termination/follow-up page exists');
          const html = Buffer.from(page.b64, 'base64').toString('utf8');
          for (const token of ['data-tab="DEFER"', 'data-pane="DEFER"', 'id="deferReason"', 'id="deferStartDate"', 'id="deferEndDate"']) {
            assert(html.includes(token), 'existing deferral form: ' + token);
          }
          for (const match of html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)) {
            new vm.Script(match[1]);
          }
          console.log('PASS: existing deferral form and scripts; no source files changed');
          JS
      - name: Confirm source was not modified
        run: git diff --exit-code
