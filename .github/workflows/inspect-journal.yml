name: Inspect counseling journal source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-journal.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract 종료·사후관리 module
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64

          s = Path('index.html').read_text(encoding='utf-8')
          patterns = [
              r'\{"id":"p11","title":"종료/사후관리","b64":"([A-Za-z0-9+/=]+)"\}',
              r'"id":"p11","title":"종료/사후관리","b64":"([A-Za-z0-9+/=]+)"',
          ]
          b64 = None
          for pat in patterns:
              m = re.search(pat, s)
              if m:
                  b64 = m.group(1)
                  break
          if not b64:
              raise SystemExit('p11 module not found')
          decoded = base64.b64decode(b64).decode('utf-8')
          Path('p11-decoded.html').write_text(decoded, encoding='utf-8')
          Path('inspect-journal.txt').write_text(
              f'p11 base64 chars={len(b64)}\ndecoded chars={len(decoded)}\ndecoded bytes={len(decoded.encode("utf-8"))}\n',
              encoding='utf-8'
          )
          print('decoded chars:', len(decoded))
          PY
      - name: Commit extracted module
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p11-decoded.html inspect-journal.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: extract 종료·사후관리 module"
          git push
