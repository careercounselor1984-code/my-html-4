name: Journal workflow heartbeat

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-journal.yml'

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write heartbeat
        run: |
          echo "workflow-ok" > workflow-heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow-heartbeat.txt
          git commit -m "chore: journal workflow heartbeat"
          git push
