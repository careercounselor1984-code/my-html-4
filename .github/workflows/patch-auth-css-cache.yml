name: Cache-bust corrected journal PIN lock CSS
on:
  push:
    branches: ["fix/auth-lock-hidden-20261011"]
    paths:
      - "tests/patch-auth-css-cache.cjs"
      - ".github/workflows/patch-auth-css-cache.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply precise CSS cache bust to index.html
        run: node tests/patch-auth-css-cache.cjs
      - name: Verify embedded pages and browser lock state
        run: |
          node tests/journal-safety.test.cjs
          node tests/login-browser-smoke.cjs
      - name: Commit fix to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix(auth): bust cached CSS to hide PIN overlays by default"
          git push origin HEAD:fix/auth-lock-hidden-20261011
