name: Apply and test stipend record cleanup
on:
  push:
    branches: ['fix/stipend-dynamic-record-20261013']
    paths: ['.github/workflows/apply-stipend-record.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Modify p06 embedded page and verify scripts
        shell: bash
        run: |
          set +e
          python scripts/patch_stipend_record.py > stipend-patch-status.txt 2>&1
          py=$?
          if [ "$py" -eq 0 ]; then
            node --check debug/p06-patched.js >> stipend-patch-status.txt 2>&1
            js=$?
          else
            js=1
          fi
          if [ "$py" -eq 0 ] && [ "$js" -eq 0 ]; then
            node tests/stipend-record-output.test.cjs >> stipend-patch-status.txt 2>&1
            t=$?
            node tests/journal-safety.test.cjs >> stipend-patch-status.txt 2>&1
            all=$?
          else
            t=1; all=1
          fi
          if [ "$py" -ne 0 ] || [ "$js" -ne 0 ] || [ "$t" -ne 0 ] || [ "$all" -ne 0 ]; then
            echo "FAILED patch=$py syntax=$js newtest=$t regression=$all" >> stipend-patch-status.txt
            git checkout -- index.html
          else
            echo "PASSED patch, script syntax, newtest, regression" >> stipend-patch-status.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html stipend-patch-status.txt
          git diff --cached --quiet || git commit -m "feat: write only income/family stipend changes in journal"
          git push
          test "$py" -eq 0 -a "$js" -eq 0 -a "$t" -eq 0 -a "$all" -eq 0
